<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto CRUD Profesional</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

/* NAVBAR */
nav{
    background:#020617;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav h2{
    color:#38bdf8;
}

nav a{
    color:white;
    margin-left:15px;
    text-decoration:none;
}

nav a:hover{
    color:#38bdf8;
}

/* CONTAINER */
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* CARDS */
.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

/* INPUTS */
input{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
}

button{
    padding:10px;
    border:none;
    border-radius:8px;
    background:#38bdf8;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

/* ITEMS */
.item{
    background:#334155;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
}

/* CARRUSEL */
.carousel img{
    width:250px;
    border-radius:10px;
}

/* SEARCH */
#search{
    width:100%;
    margin-top:10px;
}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:20px;
    opacity:0.7;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <h2>CRUD Proyecto</h2>
    <div>
        <a href="#">Inicio</a>
        <a href="#crud">CRUD</a>
    </div>
</nav>

<div class="container">

<!-- PRESENTACION -->
<div class="card">
<h1>Proyecto Web - Evidencia 3</h1>
<p>Desarrollo de un sistema CRUD para gestionar componentes y mantenimientos de computadoras.</p>

<p><b>Nombre:</b> Daniel Reyes Martínez</p>
<p><b>Matrícula:</b> AL05053857</p>
<p><b>Profesor:</b> Marco Horacio Moreno González</p>
</div>

<!-- BUSCADOR -->
<input type="text" id="search" placeholder="Buscar componente..." onkeyup="render()">

<!-- CRUD -->
<div class="card" id="crud">

<h2>Gestión de Componentes</h2>

<input type="text" id="name" placeholder="Nombre">
<input type="text" id="type" placeholder="Tipo">
<input type="text" id="status" placeholder="Estado">

<button onclick="addItem()">Agregar</button>

<div id="list"></div>

</div>

<div class="footer">
<p>Evidencia 3 - Proyecto Web</p>
</div>

</div>

<script>
let items = [
{
name:"Tarjeta gráfica",
type:"Hardware",
status:"Funcional",
images:[
"https://cdn.cloudflare.steamstatic.com/steam/apps/3010850/header.jpg",
"https://cdn.cloudflare.steamstatic.com/steam/apps/3010850/capsule_616x353.jpg"
]
}
];

function save(){
localStorage.setItem("items", JSON.stringify(items));
}

function addItem(){
let name = document.getElementById("name").value;
let type = document.getElementById("type").value;
let status = document.getElementById("status").value;

if(!name || !type || !status){
alert("Completa todos los campos");
return;
}

items.push({
name,
type,
status,
images:[
"https://cdn.cloudflare.steamstatic.com/steam/apps/3010850/header.jpg",
"https://cdn.cloudflare.steamstatic.com/steam/apps/3010850/capsule_616x353.jpg"
]
});

save();
render();
}

function deleteItem(i){
items.splice(i,1);
save();
render();
}

function nextImage(i){
let item = items[i];
item.current = (item.current || 0) + 1;
if(item.current >= item.images.length) item.current = 0;
render();
}

function prevImage(i){
let item = items[i];
item.current = (item.current || 0) - 1;
if(item.current < 0) item.current = item.images.length-1;
render();
}

function render(){
let list = document.getElementById("list");
let search = document.getElementById("search").value.toLowerCase();

list.innerHTML="";

items.forEach((item,i)=>{

if(item.name.toLowerCase().includes(search)){

let current = item.current || 0;

list.innerHTML += `
<div class="item">
<h3>${item.name}</h3>
<p>Tipo: ${item.type}</p>
<p>Estado: ${item.status}</p>

<div class="carousel">
<img src="${item.images[current]}"><br>
<button onclick="prevImage(${i})">◀</button>
<button onclick="nextImage(${i})">▶</button>
</div>

<button onclick="deleteItem(${i})">Eliminar</button>
</div>
`;
}
});
}

render();
</script>

</body>
</html>
